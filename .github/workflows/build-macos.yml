name: Build macOS preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-macos.yml'
      - 'platform_support.py'
      - 'build_macos.py'
      - 'DextyTwitchNotifier-mac.spec'
      - 'requirements-mac-build.txt'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      DEXTY_DATA_DIR: ${{ github.workspace }}/.dexty-test-profile
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-mac-build.txt
      - name: Prepare isolated profile
        run: mkdir -p "$DEXTY_DATA_DIR"
      - name: Test source and platform helpers
        run: python -m unittest test_release test_platform -v
      - name: Build and verify application and DMG
        run: python build_macos.py
      - name: Save downloadable Mac preview
        uses: actions/upload-artifact@v4
        with:
          name: Dexty-Twitch-Notifier-macOS-${{ matrix.arch }}-Preview
          path: |
            output/*Preview.dmg
            output/SHA256SUMS-*.txt
            mac-self-test.json
            MAC_TEST_GUIDE.md
          if-no-files-found: error
          retention-days: 14
